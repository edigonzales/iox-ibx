plugins { id 'java-library'; id 'maven-publish' }
group = 'ch.interlis'
version = '0.2.0-SNAPSHOT'
repositories {
    mavenCentral()
    maven { url = uri('https://jars.interlis.ch') }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
dependencies {
    api 'ch.interlis:iox-api:1.0.3'
    api 'ch.interlis:iox-ili:1.24.4'
    api 'ch.interlis:ili2c-core:5.6.8'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.22.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.github.luben:zstd-jni:1.5.7-16'
    implementation 'com.fasterxml.woodstox:woodstox-core:7.2.2'
    testImplementation 'junit:junit:4.13.2'
}

test { systemProperty 'ibx.test.classpath', sourceSets.test.runtimeClasspath.asPath }
tasks.withType(Jar).configureEach { from(files('THIRD_PARTY.md', 'LICENSE')) { into 'META-INF' } }
publishing {
  publications { mavenJava(MavenPublication) { from components.java } }
  repositories {
    maven {
      name = 'interlisGuruSnapshots'
      url = uri('https://jars.interlis.guru/snapshots')
      credentials {
        username = providers.gradleProperty('mavenRepoUser').orElse(providers.environmentVariable('MAVEN_REPO_USER')).orNull
        password = providers.gradleProperty('mavenRepoPassword').orElse(providers.environmentVariable('MAVEN_REPO_PASSWORD')).orNull
      }
    }
  }
}

def sourceCommit = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.map { it.trim() }
tasks.withType(Jar).configureEach {
    manifest { attributes('Implementation-Version': project.version, 'Source-Commit': sourceCommit.get()) }
}
